      - name: Save validated backup
        run: |
          set -euo pipefail
          git config user.name 'Backup Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- error_log.txt
          if git diff --cached --quiet -- error_log.txt; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update backup [$(date -u +%Y-%m-%dT%H:%MZ)]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              echo "Push failed; check permissions, branch protection or concurrent edits."
              exit 1
            fi
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            sleep 3
